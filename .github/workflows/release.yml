name: release

# build and attach the installers when a version tag is pushed. Windows gets
# nsis setup.exe and wix MSI; Linux gets .deb, .rpm, and AppImage. both jobs target the same tag,
# so tauri-action creates the release once and the second job attaches to it.
# the jobs run in order so their updater metadata is merged without a race.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # bypass the runner's machine-level sccache wrapper, whose server drops
  # connections mid-build; Swatinem/rust-cache still caches deps between runs
  RUSTC_WRAPPER: ""

jobs:
  build-windows:
    if: github.actor == 'zeo'
    runs-on: [self-hosted, windows-vm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: isolate cargo source extraction
        shell: powershell
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP 'iris-cargo-home'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome" -Encoding utf8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # the ephemeral vms use a per-run _work/vm-<id> path, so a restored target
          # dir has dead absolute paths in its build-script binaries and dep-info files
          # and the build fails on them; cache the cargo registry only, rebuild target
          cache-targets: "false"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 9
      - name: install frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: build bridge installer
        shell: powershell
        env:
          TERMIE_INSTALLER_PUBLIC_KEY: ${{ vars.TERMIE_INSTALLER_PUBLIC_KEY }}
          CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          cargo build --release --locked --manifest-path .rot-installer\Cargo.toml --bin rot-installer --bin rot-pack
          if ($LASTEXITCODE -ne 0) { throw "shared installer build failed" }
          $installer = '.rot-installer\target\release\rot-installer.exe'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) { throw "certificate thumbprint is unavailable" }
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 $installer
          if ($LASTEXITCODE -ne 0) { throw "installer signing failed" }
          cargo build --release --locked -p iris-service
          if ($LASTEXITCODE -ne 0) { throw "engine build failed" }
          & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 target\release\iris-engine.exe
          if ($LASTEXITCODE -ne 0) { throw "engine signing failed" }
          New-Item -ItemType Directory -Force bridge | Out-Null
          Copy-Item $installer bridge\rot-installer.exe
      - name: build and release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'iris ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.bridge.conf.json

      - name: pack shared installer release
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $stage = Join-Path $env:RUNNER_TEMP 'iris-rpack'
          New-Item -ItemType Directory -Force "$stage\engine","$stage\resources\geo" | Out-Null
          Copy-Item target\release\iris.exe $stage\
          Copy-Item target\release\iris-engine.exe "$stage\engine\"
          Copy-Item app\src-tauri\resources\geo\dbip-country.mmdb "$stage\resources\geo\"
          $pack = '.rot-installer\target\release\rot-pack.exe'
          $installer = '.rot-installer\target\release\rot-installer.exe'
          function Invoke-RotPack {
            & $pack @args
            if ($LASTEXITCODE -ne 0) { throw "rot-pack failed with exit code $LASTEXITCODE" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $package = "dist\iris-$ver-windows-x86_64.rpack"
          Invoke-RotPack pack $stage $package --app iris --version $ver
          Invoke-RotPack sign $package "$package.minisig"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$(Split-Path $package -Leaf)"
          Invoke-RotPack manifest $package dist\installer.json --url $url --signature "$package.minisig" --published-at ([DateTime]::UtcNow.ToString('o')) --target windows-x86_64
          Invoke-RotPack sign dist\installer.json dist\installer.json.minisig
          Invoke-RotPack online $installer "dist\iris-$ver-online-setup.exe"
          Invoke-RotPack offline $installer $package "$package.minisig" "dist\iris-$ver-offline-setup.exe" --app iris
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          foreach ($file in @("dist\iris-$ver-online-setup.exe", "dist\iris-$ver-offline-setup.exe")) {
            & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $file" }
          }

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/iris-*.rpack
            dist/iris-*.rpack.minisig
            dist/iris-*-online-setup.exe
            dist/iris-*-offline-setup.exe
            dist/installer.json
            dist/installer.json.minisig
          fail_on_unmatched_files: true

  build-linux:
    if: github.actor == 'zeo'
    needs: build-windows
    runs-on: [self-hosted, linux-vm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: cargo on PATH
        run: |
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          dirname "$(rustup which cargo)" | tee -a "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # the ephemeral vms use a per-run _work/vm-<id> path, so a restored target
          # dir has dead absolute paths in its build-script binaries and dep-info files
          # and the build fails on them; cache the cargo registry only, rebuild target
          cache-targets: "false"
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev libnetfilter-queue-dev nftables patchelf rpm file xdg-utils
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 9
      - name: install frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: build and release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'iris ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: build shared installer tools
        env:
          TERMIE_INSTALLER_PUBLIC_KEY: ${{ vars.TERMIE_INSTALLER_PUBLIC_KEY }}
        run: cargo build --release --locked --manifest-path .rot-installer/Cargo.toml --bin rot-installer --bin rot-pack

      - name: pack shared installer release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/iris-rpack"
          mkdir -p "$stage/engine" "$stage/resources/geo" dist
          install -m755 target/release/iris "$stage/iris"
          install -m755 target/release/iris-engine "$stage/engine/iris-engine"
          install -m644 app/src-tauri/resources/geo/dbip-country.mmdb "$stage/resources/geo/"
          pack=.rot-installer/target/release/rot-pack
          installer=.rot-installer/target/release/rot-installer
          package="dist/iris-$ver-linux-x86_64.rpack"
          "$pack" pack "$stage" "$package" --app iris --version "$ver"
          "$pack" sign "$package" "$package.minisig"
          curl --proto '=https' --tlsv1.2 --retry 5 --location --fail \
            -o dist/installer.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/installer.json"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$package")"
          "$pack" manifest "$package" dist/installer.json --url "$url" --signature "$package.minisig" --published-at "$(date --utc --iso-8601=seconds)" --target linux-x86_64
          "$pack" sign dist/installer.json dist/installer.json.minisig
          "$pack" online "$installer" "dist/iris-$ver-linux-x86_64-setup"
          "$pack" offline "$installer" "$package" "$package.minisig" "dist/iris-$ver-linux-x86_64-offline-setup" --app iris
          chmod 755 dist/iris-*-setup

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/iris-*.rpack
            dist/iris-*.rpack.minisig
            dist/iris-*-setup
            dist/installer.json
            dist/installer.json.minisig
          overwrite_files: true
          fail_on_unmatched_files: true
