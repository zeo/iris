[package]
name = "iris-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Iris, a firewall and network monitor"

[lib]
name = "iris_app_lib"

[[bin]]
name = "iris"
path = "src/main.rs"

[features]
devtools = []

[build-dependencies]
ceri-build = { git = "https://github.com/zeo/ceri", tag = "v0.1.14" }

[dependencies]
ceri = { git = "https://github.com/zeo/ceri", tag = "v0.1.14" }
iris-core = { workspace = true }
iris-ipc = { workspace = true, features = ["transport"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dns-lookup = "4"
base64 = "0.23"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
